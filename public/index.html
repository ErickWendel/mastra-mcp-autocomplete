<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mastra + MCP autocomplete</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <main>
        <header>
            <h1><span class="accent">&gt;_</span> autocomplete</h1>
            <p class="muted">Paste a post, YouTube or event URL. A Mastra agent reads it (fetch first, a real browser through Playwright MCP when needed) and fills the form as it finds each field.</p>
        </header>

        <form id="url-form" class="url-form" autocomplete="off">
            <input id="url" type="url" placeholder="paste a URL: https://..." required />
            <button id="autocomplete" type="submit">Autocomplete</button>
        </form>
        <div id="types" class="types"></div>

        <section id="progress" class="progress" hidden></section>

        <form id="contribution" class="contribution" autocomplete="off">
            <div id="fields" class="fields"></div>
            <div class="actions">
                <button id="save" type="submit" disabled>Save</button>
                <button id="clear" type="button" class="ghost">clear</button>
            </div>
        </form>

        <section>
            <h2>Saved <span id="count" class="muted"></span></h2>
            <div id="grid" class="grid"></div>
        </section>
    </main>
    <script type="module" src="js/app.js"></script>
</body>
</html>
