<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mastra + MCP autocomplete</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%23050505%22/%3E%3Ctext x=%224%22 y=%2222%22 font-family=%22monospace%22 font-size=%2216%22 fill=%22%2322c55e%22%3E%3E_%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <main>
        <header>
            <h1><span class="accent">&gt;_</span> autocomplete</h1>
            <p class="muted">Paste an event's link (the agenda, a talk page or even the home page). Two Mastra agents browse it at the same time like a person, through Playwright MCP: one finds the talk, the other the event and its address. The form fills as they find each field.</p>
        </header>

        <form id="url-form" class="url-form" autocomplete="off">
            <input id="url" type="url" placeholder="paste an event link: https://..." required />
            <button id="autocomplete" type="submit">Autocomplete</button>
        </form>

        <section id="progress" class="progress" hidden></section>

        <form id="contribution" class="contribution" autocomplete="off">
            <div id="fields" class="fields"></div>
            <div class="actions">
                <button id="save" type="submit" disabled>Save</button>
                <button id="clear" type="button" class="ghost">clear</button>
            </div>
        </form>

        <section>
            <h2>Saved <span id="count" class="muted"></span></h2>
            <div id="grid" class="grid"></div>
        </section>
    </main>
    <script type="module" src="js/main.ts"></script>
</body>
</html>
